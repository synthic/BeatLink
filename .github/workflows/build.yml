name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Platform-neutral core and its tests build and run on any runner.
      - name: Build core
        run: dotnet build BeatLink.Core/BeatLink.Core.csproj -c Release

      - name: Run tests
        run: dotnet run --project BeatLink.Tests/BeatLink.Tests.csproj -c Release

      # The WinUI app only builds on Windows.
      - name: Build app
        run: dotnet build BeatLink/BeatLink.csproj -c Release -p:Platform=x64

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish BeatLink/BeatLink.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatLink-${{ github.ref_name }}
          path: BeatLink/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/
